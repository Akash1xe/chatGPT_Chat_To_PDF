<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Chat to PDF Options</title>
  <style>
    body { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #111827; }
    main { max-width: 760px; margin: 40px auto; padding: 0 20px 60px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    h1 { margin-top: 0; }
    p { color: #4b5563; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    input, select { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 9px; padding: 9px 10px; font: inherit; background: white; }
    .full { grid-column: 1 / -1; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .check input { width: auto; }
    button { margin-top: 18px; border: 0; border-radius: 9px; padding: 10px 15px; background: #111827; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    #status { margin-left: 10px; font-size: 13px; color: #047857; }
    .note { padding: 12px; border-radius: 10px; background: #eff6ff; color: #1e3a8a; font-size: 13px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>ChatGPT Chat to PDF</h1>
      <p>Configure PDF generation. Your PDFCrowd credentials are stored with Chrome sync storage and are not committed to this repository.</p>
      <div class="note">The extension does not reuse the reference project's embedded API credentials. Use credentials from your own PDFCrowd account.</div>

      <div class="grid" style="margin-top:18px">
        <label class="full">PDFCrowd username
          <input id="pdfcrowdUsername" autocomplete="username" placeholder="Your PDFCrowd username">
        </label>
        <label class="full">PDFCrowd API key
          <input id="pdfcrowdApiKey" type="password" autocomplete="current-password" placeholder="Your PDFCrowd API key">
        </label>
        <label>Page size
          <select id="pageSize">
            <option value="a4">A4</option>
            <option value="letter">Letter</option>
          </select>
        </label>
        <label>Orientation
          <select id="orientation">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </label>
        <label>Theme
          <select id="theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>Top margin
          <input id="marginTop" value="0.4in">
        </label>
        <label>Right margin
          <input id="marginRight" value="0.4in">
        </label>
        <label>Bottom margin
          <input id="marginBottom" value="0.4in">
        </label>
        <label>Left margin
          <input id="marginLeft" value="0.4in">
        </label>
        <label class="check full">
          <input id="includeSourceLink" type="checkbox">
          Include ChatGPT conversation link in the PDF
        </label>
      </div>

      <button id="save" type="button">Save options</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="src/shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
