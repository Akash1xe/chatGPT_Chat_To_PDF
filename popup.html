<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { width: 340px; margin: 0; padding: 16px; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111827; background: #fff; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .sub { margin: 0 0 14px; color: #6b7280; font-size: 12px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 12.5px; }
    .row span:first-child { color: #6b7280; }
    .value { font-weight: 700; text-align: right; }
    .ok { color: #047857; }
    .warn { color: #b45309; }
    .bad { color: #b91c1c; }
    .muted { color: #6b7280; font-weight: 600; }
    .hint { font-size: 12px; line-height: 1.45; color: #4b5563; margin: 0 0 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { border: 0; border-radius: 9px; padding: 9px 10px; background: #111827; color: white; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #f3f4f6; color: #111827; }
    #status-message { min-height: 16px; margin-top: 10px; font-size: 11.5px; color: #6b7280; }
    @media (prefers-color-scheme: dark) {
      body { background: #171717; color: #f5f5f5; }
      .card { background: #222; border-color: #3f3f46; }
      .sub, .row span:first-child, .hint, #status-message { color: #a3a3a3; }
      button { background: #f5f5f5; color: #111; }
      button.secondary { background: #333; color: #f5f5f5; }
    }
  </style>
</head>
<body>
  <h1>ChatGPT Chat to PDF</h1>
  <p class="sub">Runtime diagnostics</p>

  <div class="card">
    <div class="row"><span>Extension</span><span id="version" class="value muted">Checking…</span></div>
    <div class="row"><span>Current page</span><span id="page-status" class="value muted">Checking…</span></div>
    <div class="row"><span>Conversation turns</span><span id="turn-count" class="value muted">—</span></div>
    <div class="row"><span>Completeness</span><span id="completeness" class="value muted">—</span></div>
    <div class="row"><span>PDFCrowd credentials</span><span id="credentials" class="value muted">Checking…</span></div>
  </div>

  <p id="guidance" class="hint">Open a ChatGPT conversation. The page will get a Save PDF button for full, range, and selected-message export.</p>

  <div class="actions">
    <button id="refresh" type="button" class="secondary">Refresh status</button>
    <button id="options" type="button">Open options</button>
  </div>
  <div id="status-message"></div>

  <script src="src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
